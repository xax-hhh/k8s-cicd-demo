<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ app_name }} · 任务管理</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="container">
    <header>
      <div>
        <p class="eyebrow">CLOUD-NATIVE DELIVERY DEMO</p>
        <h1>轻量任务管理</h1>
        <p class="muted">一个用于验证 Kubernetes 应用交付、持久化与可观测性的示例业务。</p>
      </div>
      <span class="version">v1 · {{ app_name }}</span>
    </header>

    <section class="panel">
      <h2>创建任务</h2>
      <form id="task-form">
        <label>任务标题<input id="title" maxlength="120" required placeholder="例如：检查 Harbor 镜像推送链路"></label>
        <label>描述<textarea id="description" rows="2" placeholder="可选"></textarea></label>
        <button type="submit">添加任务</button>
        <p id="form-message" class="muted" role="status"></p>
      </form>
    </section>

    <section class="panel">
      <div class="section-heading">
        <h2>任务列表</h2>
        <button class="secondary" id="refresh" type="button">刷新</button>
      </div>
      <div id="tasks" class="tasks"><p class="muted">正在加载...</p></div>
    </section>

    <footer>
      <span>Health: <a href="/health">/health</a></span>
      <span>Ready: <a href="/ready">/ready</a></span>
      <span>Metrics: <a href="/metrics">/metrics</a></span>
    </footer>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
