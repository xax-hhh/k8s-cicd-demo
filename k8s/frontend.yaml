apiVersion: apps/v1
kind: Deployment
metadata: { name: guestbook-frontend, namespace: default }
spec:
  replicas: 1
  selector: { matchLabels: { app: guestbook-frontend } }
  template:
    metadata: { labels: { app: guestbook-frontend } }
    spec:
      containers:
      - name: frontend
        image: harbor.k8s.local:32078/myapp/guestbook-frontend:initial
        ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata: { name: frontend-svc, namespace: default }
spec:
  selector: { app: guestbook-frontend }
  ports: [{ port: 80 }]