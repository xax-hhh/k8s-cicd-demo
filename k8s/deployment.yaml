apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-demo-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-demo-app
  template:
    metadata:
      labels:
        app: my-demo-app
    spec:
      # 告诉 K8s 去 Harbor 拉取私有镜像需要凭证
      imagePullSecrets:
        - name: harbor-cred
      containers:
        - name: my-demo-app
          # 这就是你刚才用 Runner 构建并推送到 Harbor 的镜像
          image: harbor.k8s.local:32078/myapp/k8s-cicd-demo:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: my-demo-app-svc
  namespace: default
spec:
  type: NodePort
  selector:
    app: my-demo-app
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080 # 对外暴露的端口，一会测试用