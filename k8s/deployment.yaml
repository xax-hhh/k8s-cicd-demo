apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-demo-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-demo-app
  template:
    metadata:
      labels:
        app: my-demo-app
    spec:
      imagePullSecrets:
        - name: harbor-cred
      containers:
        - name: my-demo-app
          # 注意：不用写 :latest，Kustomize 会自动加上真实的 Tag
          image: harbor.k8s.local:32078/myapp/k8s-cicd-demo
          ports:
            - containerPort: 80