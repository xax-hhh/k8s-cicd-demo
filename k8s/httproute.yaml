apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: task-demo
  namespace: default
spec:
  parentRefs:
    - name: app-gateway
      sectionName: http
  hostnames:
    - task-demo.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: task-demo
          port: 80