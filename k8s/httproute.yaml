
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: guestbook-route
  namespace: default
spec:
  parentRefs:
    - name: guestbook-gateway
      namespace: default
  hostnames:
    - guestbook.k8s.local
  rules:
    # API 请求转发给 Backend
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: backend-svc
          port: 8080

    # 其他请求转发给 Frontend
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend-svc
          port: 80
