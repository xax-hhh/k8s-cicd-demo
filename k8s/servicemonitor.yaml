apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: task-demo
  namespace: default
  labels:
    # 需要与 kube-prometheus-stack 的 serviceMonitorSelector 匹配；
    # 若你的 Prometheus 使用其他 selector，请按实际配置调整。
    release: kube-prom
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: task-demo
  namespaceSelector:
    matchNames:
      - task-demo
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
