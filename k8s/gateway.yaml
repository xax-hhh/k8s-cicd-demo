
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: guestbook-gateway
  namespace: default
spec:
  gatewayClassName: eg
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: guestbook-envoy-proxy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: guestbook.k8s.local
      allowedRoutes:
        namespaces:
          from: Same
