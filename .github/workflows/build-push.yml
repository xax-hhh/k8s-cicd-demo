name: Pure CI Pipeline

on:
  push:
    branches: ["main"]
    # 👇 只有代码文件变动才触发，避免 Image Updater 改 yaml 引发死循环
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/**'
      - '!k8s/**'
      - '!README.md'

env:
  HARBOR_REGISTRY: harbor.k8s.local:32078
  HARBOR_PROJECT: myapp

jobs:
  build-and-push:
    runs-on: my-runners
    # 👇 核心魔法：矩阵策略。GitHub 会同时启动两个 Job，一个跑 backend，一个跑 frontend
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name: Setup Git Proxy
        run: |
          git config --global http.proxy http://192.168.31.115:7890
          git config --global https.proxy http://192.168.31.115:7890

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set Short SHA
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "Target image tag: $SHORT_SHA"

      - name: Setup Harbor Cert
        run: |
          install -d "$HOME/.docker/certs.d/${HARBOR_REGISTRY}"
          test -s /tmp/harbor-ca/ca.crt
          install -m 0644 /tmp/harbor-ca/ca.crt \
            "$HOME/.docker/certs.d/${HARBOR_REGISTRY}/ca.crt"

      - name: Login to Harbor
        env:
          HARBOR_USER: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASS: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          test -n "$HARBOR_USER"
          test -n "$HARBOR_PASS"
          echo "$HARBOR_PASS" | docker login "$HARBOR_REGISTRY" \
            -u "$HARBOR_USER" --password-stdin

      # 👇 动态根据矩阵变量，进入对应目录并构建推拉
      - name: Build and push ${{ matrix.component }}
        run: |
          IMAGE_FULL="${HARBOR_REGISTRY}/${HARBOR_PROJECT}/guestbook-${{ matrix.component }}:${SHORT_SHA}"
          cd ${{ matrix.component }}
          docker build -t "$IMAGE_FULL" .
          docker push "$IMAGE_FULL"
          echo "Pushed image: $IMAGE_FULL"