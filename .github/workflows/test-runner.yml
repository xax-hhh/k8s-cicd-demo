name: Build and Push to Harbor

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: my-runners
    steps:
      - name: Setup Git Proxy
        run: |
          git config --global http.proxy http://192.168.31.115:7890
          git config --global https.proxy http://192.168.31.115:7890

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare Cert and Login
        run: |
          echo "====== 动态修改 /etc/hosts ======"
          # 强行把域名写进 Pod 内部
          sudo sh -c 'echo "192.168.66.21 harbor.k8s.local" >> /etc/hosts'
          
          echo "====== 配置证书 ======"
          mkdir -p ~/.docker/certs.d/harbor.k8s.local:32078
          echo "${{ secrets.HARBOR_CA_CRT }}" | base64 -d > ~/.docker/certs.d/harbor.k8s.local:32078/ca.crt
          
          echo "====== 登录 Harbor ======"
          # 使用域名登录，这样 Docker 会发送 SNI，Envoy Gateway 就能放行
          echo "${{ secrets.HARBOR_PASSWORD }}" | docker login harbor.k8s.local:32078 -u "${{ secrets.HARBOR_USERNAME }}" --password-stdin

      - name: Build and push Docker image
        run: |
          # 同样使用域名进行构建和推送
          docker build -t harbor.k8s.local:32078/myapp/k8s-cicd-demo:latest .
          docker push harbor.k8s.local:32078/myapp/k8s-cicd-demo:latest