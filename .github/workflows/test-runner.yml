name: Build and Push to Harbor

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: my-runners
    steps:
      - name: Setup Git Proxy
        run: |
          git config --global http.proxy http://192.168.31.115:7890
          git config --global https.proxy http://192.168.31.115:7890

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: harbor.k8s.local:32078
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t harbor.k8s.local:32078/myapp/k8s-cicd-demo:latest .
          docker push harbor.k8s.local:32078/myapp/k8s-cicd-demo:latest