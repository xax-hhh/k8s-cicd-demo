name: Build and Push to Harbor

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: my-runners
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 侦探步骤：看看 Pod 内部到底认不认这个域名
      - name: Debug DNS
        run: |
          echo "====== 查看 /etc/hosts ======"
          cat /etc/hosts
          echo "====== 测试网络连通性 ======"
          ping -c 2 harbor.k8s.local || true
          echo "====== 查看证书目录 ======"
          ls -l /etc/docker/certs.d/harbor.k8s.local:32078/

      - name: Login to Harbor
        env:
          HARBOR_USER: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASS: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          echo "$HARBOR_PASS" | docker login harbor.k8s.local:32078 -u "$HARBOR_USER" --password-stdin

      - name: Build and push Docker image
        run: |
          docker build -t harbor.k8s.local:32078/myapp/k8s-cicd-demo:latest .
          docker push harbor.k8s.local:32078/myapp/k8s-cicd-demo:latest